name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (CP1-CP4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Check image size
        run: docker images day12-agent:${{ github.sha }} --format "{{.Size}}"

      - name: Smoke test container
        run: |
          docker run -d --name agent-ci -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs agent-ci
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.RAILWAY_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy with Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --service "$RAILWAY_SERVICE" --ci

      - name: Skip deploy (chưa cấu hình RAILWAY_TOKEN)
        if: env.RAILWAY_TOKEN == ''
        run: echo "RAILWAY_TOKEN chưa được đặt trong GitHub Secrets — bỏ qua bước deploy."

      - name: Smoke test production
        if: env.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health"; then
              curl -fsS "$PUBLIC_URL/ready"
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
                -H "Content-Type: application/json" -d '{"question":"ci"}')
              test "$code" = "401"
              exit 0
            fi
            sleep 10
          done
          exit 1
